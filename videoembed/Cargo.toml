[package]
name = "videoembed"
version = "0.1.0"
edition = "2024"

[dependencies]
llama-cpp-2 = { version = "0.1.158", features = ["mtmd"] }
llama-cpp-sys-2 = { version = "0.1.158" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
rfd = "0.17"
open = "5"
percent-encoding = "2"

[patch.crates-io]
llama-cpp-sys-2 = { path = "../vendor/llama-cpp-sys-2" }
llama-cpp-2 = { path = "../vendor/llama-cpp-2" }
